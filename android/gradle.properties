# Gradle 配置。注意：本机沙箱不允许写入用户主目录，
# 因此把 Gradle 的所有状态目录都重定向到工程内的 .android-build 下。

org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
# Gradle 用户目录与临时目录由 .android-build/build_apk.ps1 通过命令行参数指定。
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.configureondemand=false
org.gradle.warning.mode=summary
# 沙箱内文件监视器初始化会失败（Couldn't open current thread），直接关闭。
org.gradle.vfs.watch=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
